version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    command: npm run dev
    env_file:
      - ../docs/env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shop
    depends_on:
      - postgres
    ports:
      - '4000:4000'

  webapp:
    build:
      context: ../webapp
    environment:
      VITE_API_URL: http://backend:4000
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
